name: QuickEats feature syntax check

on:
  push:
    branches:
      - quickeats-analytics-refunds
  pull_request:
    branches:
      - main

jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check WhatsApp bot JavaScript syntax
        run: node --check whatsapp-bot-server.js
